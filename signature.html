
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Delivery Confirmation</title>

<style>
body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    padding: 20px;
}

.container {
    max-width: 500px;
    margin: auto;
}

h2 {
    color: #f5c400;
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 16px;
    box-sizing: border-box;
    background: #252525;
    color: white;
    border: 1px solid #f5c400;
    border-radius: 6px;
}

canvas {
    width: 100%;
    height: 200px;
    background: white;
    border: 2px solid #f5c400;
    border-radius: 8px;
    touch-action: none;
}

button {
    padding: 12px;
    margin-top: 12px;
    border: none;
    border-radius: 6px;
    background: #f5c400;
    color: #111;
    font-weight: bold;
    cursor: pointer;
}

#message {
    color: #f5c400;
}
</style>
</head>

<body>
<div class="container">

<h2>CEYLINCO GENERAL INSURANCE</h2>
<h3>Delivery Confirmation</h3>

<label>Barcode Number</label>
<input id="barcode" placeholder="Enter barcode number">

<label>Recipient Name</label>
<input id="recipient" placeholder="Enter recipient name">

<label>Recipient Signature</label>
<canvas id="signature"></canvas>

<br>

<button onclick="clearSignature()">Clear</button>
<button onclick="saveDelivery()">Confirm Delivery</button>

<p id="message"></p>

</div>

<script>
const canvas = document.getElementById("signature");
const ctx = canvas.getContext("2d");

let drawing = false;
let signed = false;

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();
    const data = canvas.toDataURL();

    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;

    ctx.scale(devicePixelRatio, devicePixelRatio);
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.strokeStyle = "#111";

    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = data;
}

resizeCanvas();

function getPosition(e) {
    const rect = canvas.getBoundingClientRect();
    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}

canvas.addEventListener("pointerdown", e => {
    drawing = true;
    signed = true;
    canvas.setPointerCapture(e.pointerId);
    const p = getPosition(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
});

canvas.addEventListener("pointermove", e => {
    if (!drawing) return;
    const p = getPosition(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
});

canvas.addEventListener("pointerup", () => drawing = false);
canvas.addEventListener("pointercancel", () => drawing = false);

function clearSignature() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    signed = false;
}

function saveDelivery() {
    const barcode = document.getElementById("barcode").value.trim();
    const recipient = document.getElementById("recipient").value.trim();

    if (!barcode || !recipient || !signed) {
        document.getElementById("message").textContent =
            "Please enter details and add a signature.";
        return;
    }

    const delivery = {
        barcode: barcode,
        recipient: recipient,
        signature: canvas.toDataURL("image/png"),
        date: new Date().toLocaleString()
    };

    const records = JSON.parse(
        localStorage.getItem("deliveries") || "[]"
    );

    records.push(delivery);
    localStorage.setItem("deliveries", JSON.stringify(records));

    document.getElementById("message").textContent =
        "Delivery saved successfully!";
}
</script>
</body>
</html>
